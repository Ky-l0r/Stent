<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 启动时由后端注入本次会话的访问令牌；写死在文件里没有意义 -->
  <meta name="stent-token" content="__STENT_TOKEN__">
  <title>Stent</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div class="app">
    <header class="titlebar" id="titlebar">
      <div class="titlebar__drag" id="dragzone">
        <span class="brand-dot"></span>
        <span class="brand-name">Stent</span>
        <span class="brand-sub">社媒内容智能体</span>
      </div>

      <div class="titlebar__right">
        <button class="status-pill" id="status" type="button" title="点击查看详情">
          <span class="status-pill__dot"></span><span class="status-pill__text">就绪</span>
        </button>
        <button class="icon-btn" id="theme-btn" type="button" title="切换主题">◐</button>
        <div class="win-controls">
          <button class="win-btn" data-win="minimize" type="button" title="最小化">—</button>
          <button class="win-btn" data-win="maximize" type="button" title="最大化">▢</button>
          <button class="win-btn win-btn--close" data-win="close" type="button" title="关闭">✕</button>
        </div>
      </div>
    </header>

    <div class="body">
      <nav class="sidebar" id="sidebar">
        <button class="nav-item" data-route="hot" type="button"><span class="nav-icon">◈</span>热点发现</button>
        <button class="nav-item" data-route="create" type="button"><span class="nav-icon">✎</span>内容创作</button>
        <button class="nav-item" data-route="drafts" type="button"><span class="nav-icon">▤</span>草稿箱<span class="nav-badge hidden" id="drafts-badge">0</span></button>
        <button class="nav-item" data-route="publish" type="button"><span class="nav-icon">➤</span>发布中心</button>
        <button class="nav-item" data-route="analytics" type="button"><span class="nav-icon">◔</span>数据分析</button>
        <button class="nav-item" data-route="profile" type="button"><span class="nav-icon">◍</span>账号画像</button>
        <div class="sidebar__gap"></div>
        <button class="nav-item" data-route="settings" type="button"><span class="nav-icon">⚙</span>设置</button>
        <div class="sidebar__meta" id="version-tag">v—</div>
      </nav>

      <main class="view" id="view">
        <div class="loading">正在加载…</div>
      </main>
    </div>
  </div>

  <div class="toast-host" id="toast-host"></div>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# windows-latest 是英文环境，Python 控制台默认 cp1252：脚本里的中文输出会
# UnicodeEncodeError。脚本自身已经 reconfigure 到 UTF-8，这里再兜一层——
# 顺便让文件读写默认按 UTF-8 处理。
env:
  PYTHONUTF8: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 规则全部来自 pyproject.toml，与本地 pre-commit 读同一份配置
      - name: 安装 ruff
        run: python -m pip install --upgrade pip ruff

      - name: ruff lint
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: 元数据一致性（版本号 / CHANGELOG / 依赖口径）
        run: python tests/check_project.py

  selftest:
    name: 服务层自检 (py${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # services / core 刻意不依赖第三方库（不装 PySide6 与 Playwright 也能跑完），
      # 所以这一步只花几十秒，却守住了 171 项断言。装了依赖反而会掩盖不该有的耦合。
      - name: 服务层端到端自检
        run: python tests/selftest_all.py

      - name: 本机接口自检（起真服务打端点）
        run: python tests/selftest_api.py

      - name: 归因链路中文化
        run: python tests/selftest_attribution_zh.py

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      # --ignore-scripts 跳过 electron 的二进制下载：CI 只做类型检查与打包前端，
      # 不需要真的开窗口（真要跑窗口会在 linux 上额外折腾 Xvfb，不值当）
      - name: 安装依赖
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: TypeScript 类型检查
        run: npm run check

      - name: 构建主进程与渲染进程
        run: npm run build

  ui-smoke:
    name: 界面冒烟（无头构建全部页面）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装运行依赖
        run: python -m pip install --upgrade pip -r requirements.txt

      # 只构建界面、跑一遍页面级自检；发布功能需要的 Chromium 内核这里不装。
      # 显式加 --qt：默认入口已切到 Web 前端，而 --selftest 是无头构建 Qt 页面。
      - name: 无头冒烟
        env:
          QT_QPA_PLATFORM: offscreen
        run: python main.py --qt --selftest

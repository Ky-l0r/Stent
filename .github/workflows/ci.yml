name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 规则全部来自 pyproject.toml，与本地 pre-commit 读同一份配置
      - name: 安装 ruff
        run: python -m pip install --upgrade pip ruff

      - name: ruff lint
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: 元数据一致性（版本号 / CHANGELOG / 依赖口径）
        run: python tests/check_project.py

  selftest:
    name: 服务层自检 (py${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # services / core 刻意不依赖第三方库（不装 PySide6 与 Playwright 也能跑完），
      # 所以这一步只花几十秒，却守住了 171 项断言。装了依赖反而会掩盖不该有的耦合。
      - name: 服务层端到端自检
        run: python tests/selftest_all.py

      - name: 归因链路中文化
        run: python tests/selftest_attribution_zh.py

  ui-smoke:
    name: 界面冒烟（无头构建全部页面）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装运行依赖
        run: python -m pip install --upgrade pip -r requirements.txt

      # 只构建界面、跑一遍页面级自检；发布功能需要的 Chromium 内核这里不装
      - name: 无头冒烟
        env:
          QT_QPA_PLATFORM: offscreen
        run: python main.py --selftest
